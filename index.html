<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ABC 기차">
<meta name="theme-color" content="#F6FAFF">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>ABC 기차</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6FAFF; --panel:#FFFFFF; --ink:#2A3654; --line:#D9E3F0; --sky:#EAF5FF; --hill:#DDF3C9; --hill2:#CBEBB0;
  --font-letter:"Baloo 2","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#16223A; --panel:#22314F; --ink:#F2F6FF; --line:#0F1A2E; --sky:#1B2B48; --hill:#24423A; --hill2:#1E3A31; color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#16223A; --panel:#22314F; --ink:#F2F6FF; --line:#0F1A2E; --sky:#1B2B48; --hill:#24423A; --hill2:#1E3A31; color-scheme:dark}
html{height:100%; scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{height:100%; background:var(--bg); color:var(--ink); overflow:hidden; overscroll-behavior:none; touch-action:manipulation;
  -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; font-family:var(--font-letter)}
button{font:inherit; color:inherit; cursor:pointer; border:none; padding:0; background:none}
button:focus-visible{outline:5px solid var(--ink); outline-offset:4px}
#vp{position:relative; height:100%; width:100%; overflow:hidden; background:var(--bg)}
#stage{position:absolute; left:0; top:0; width:1600px; height:1000px; transform-origin:0 0; overflow:hidden; background:var(--bg)}
#scene{position:absolute; inset:0}
.abs{position:absolute}
.L{font-family:var(--font-letter); font-weight:800; line-height:1}
.L > span, .cap{display:block; line-height:1; text-box:trim-both cap alphabetic}

/* HUD */
.hbtn{position:absolute; top:26px; width:96px; height:96px; border-radius:50%; background:var(--panel); color:var(--ink);
  display:grid; place-items:center; box-shadow:0 7px 0 var(--line); z-index:40; transition:transform .1s, box-shadow .1s}
.hbtn:active{transform:translateY(5px); box-shadow:0 2px 0 var(--line)}
.hbtn svg{width:50px; height:50px}
#homeBtn{left:30px}
#musicBtn{right:140px}
#skipBtn{right:30px; width:80px; height:80px; top:34px; opacity:.75}
#skipBtn svg{width:40px; height:40px}
#dots{position:absolute; top:58px; left:50%; transform:translateX(-50%); display:flex; gap:16px; z-index:40}
#dots i{width:24px; height:24px; border-radius:50%; background:var(--line); transition:transform .3s, background .3s}
#dots i.on{background:var(--c); transform:scale(1.35)}
#dots i.done{background:var(--c); opacity:.45}
#badge{position:absolute; left:34px; top:846px; width:126px; height:126px; border-radius:30px; background:var(--panel);
  box-shadow:0 7px 0 var(--line); display:grid; place-items:center; font-size:96px; z-index:40; transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
#badge.hide{transform:scale(0)}
.hidden{display:none !important}

/* train */
.sky{position:absolute; inset:0; background:linear-gradient(var(--sky), var(--bg) 70%)}
.cloud{position:absolute; width:220px; height:70px; border-radius:40px; background:var(--panel); opacity:.9; animation:drift 40s linear infinite}
.cloud::before,.cloud::after{content:""; position:absolute; background:inherit; border-radius:50%}
.cloud::before{width:100px; height:100px; left:40px; top:-50px}
.cloud::after{width:80px; height:80px; left:110px; top:-34px}
@keyframes drift{from{transform:translateX(0)} to{transform:translateX(-300px)}}
.hill{position:absolute; border-radius:50%; background:var(--hill)}
.scroller{position:absolute; left:0; top:150px; width:1600px; height:800px; overflow-x:auto; overflow-y:hidden; touch-action:pan-x; scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
.track{position:relative; height:100%; display:flex; align-items:flex-end; width:max-content; padding:0 520px 60px 60px}
.rail{position:absolute; left:0; right:0; bottom:38px; height:30px;
  background:linear-gradient(#B9A58F,#B9A58F) 0 4px/100% 8px no-repeat, repeating-linear-gradient(90deg,#C9B49B 0 26px,transparent 26px 70px) 0 12px/100% 18px no-repeat}
.engine{position:relative; width:440px; height:460px; flex:none}
.engine svg{width:100%; height:100%}
.puff{position:absolute; left:325px; top:120px; width:60px; height:60px; border-radius:50%; background:var(--panel); opacity:0; pointer-events:none}
.engine.toot .puff{animation:puff 1.4s ease-out}
.engine.toot .puff:nth-child(3){animation-delay:.25s}
.engine.toot .puff:nth-child(4){animation-delay:.5s}
@keyframes puff{0%{opacity:.95; transform:translate(0,0) scale(.5)}100%{opacity:0; transform:translate(-80px,-150px) scale(1.8)}}
.car{position:relative; width:340px; height:460px; flex:none}
.car .ani{position:absolute; left:50%; bottom:222px; width:200px; height:270px; margin-left:-100px; animation:bob 2.4s ease-in-out infinite; animation-delay:var(--d)}
.car .ani svg,.big-ani svg,.nextTag .e svg{width:100%; height:100%; display:block}
.car .body{position:absolute; left:20px; bottom:86px; width:300px; height:172px; border-radius:30px; background:var(--c);
  box-shadow:inset 0 -18px 0 rgba(0,0,0,.08), inset 0 16px 0 rgba(255,255,255,.22); display:grid; place-items:center;
  color:#fff; font-size:150px; text-shadow:0 5px 0 rgba(0,0,0,.12)}
.car .wheel{position:absolute; bottom:46px; width:84px; height:84px; border-radius:50%; background:#fff; border:16px solid var(--e)}
.car .wheel::after{content:""; position:absolute; inset:16px; border-radius:50%; background:var(--e)}
.car .w1{left:52px} .car .w2{right:52px}
.car .hook{position:absolute; left:-14px; bottom:120px; width:44px; height:16px; border-radius:8px; background:#8A97B3}
.car .star{position:absolute; right:6px; bottom:228px; width:76px; height:76px; display:none}
.car.done .star{display:block}
.car:active .body{transform:translateY(6px)}
.car.next .body{animation:nudge 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-12px)}}
@keyframes nudge{0%,100%{transform:translateY(0)}12%{transform:translateY(-16px)}24%{transform:translateY(0)}36%{transform:translateY(-8px)}48%{transform:translateY(0)}}
.note{position:absolute; left:200px; right:200px; top:40px; text-align:center; font-family:system-ui,sans-serif; font-size:32px; color:var(--ink); opacity:.75}

/* lesson pieces */
.big-ani{width:300px; height:405px}
.drop{animation:drop .9s cubic-bezier(.3,1.5,.5,1) both}
@keyframes drop{0%{transform:translateY(-900px)}100%{transform:translateY(0)}}
.squish{animation:squish .45s}
@keyframes squish{40%{transform:scale(1.08,.9)}70%{transform:scale(.96,1.05)}}
.hop{animation:hop .55s}
@keyframes hop{35%{transform:translateY(-16%) scale(1.05)}70%{transform:translateY(0) scale(.97)}}
.wiggle{animation:wiggle .45s}
@keyframes wiggle{20%{transform:rotate(-12deg)}40%{transform:rotate(12deg)}60%{transform:rotate(-7deg)}80%{transform:rotate(7deg)}}
.shake{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-24px)}40%{transform:translateX(24px)}60%{transform:translateX(-14px)}80%{transform:translateX(14px)}}
.popin{animation:popin .45s cubic-bezier(.3,1.7,.5,1) both}
@keyframes popin{from{transform:scale(0)}}
.lifted{z-index:20; filter:drop-shadow(0 18px 8px rgba(30,45,80,.18)); transform:scale(1.08)}

.gift{width:160px; height:140px; touch-action:none; z-index:2}
.gift .bx{position:absolute; left:8px; right:8px; bottom:0; height:112px; border-radius:16px; background:var(--c);
  box-shadow:inset 0 -12px 0 rgba(0,0,0,.08); display:grid; place-items:center; color:#fff; font-size:84px; text-shadow:0 4px 0 rgba(0,0,0,.12)}
.gift .lid{position:absolute; left:0; right:0; top:8px; height:30px; border-radius:12px; background:var(--e)}
.gift .bow{position:absolute; top:-8px; width:34px; height:28px; border-radius:50%; border:8px solid var(--e); background:transparent}
.gift .bow.l{left:44px; transform:rotate(-20deg)} .gift .bow.r{right:44px; transform:rotate(20deg)}

.float{position:absolute; left:0; top:0; width:150px; height:170px; display:grid; place-items:center; font-size:170px; text-shadow:0 6px 0 rgba(0,0,0,.08); touch-action:none}
.float > span{transition:transform .3s, opacity .3s}
.float.gone > span{transform:scale(1.8); opacity:0}
.flower{position:absolute; font-size:80px; line-height:1; pointer-events:none; animation:bloom 2.2s ease-out both}
@keyframes bloom{0%{transform:scale(0) rotate(-90deg); opacity:0}18%{transform:scale(1.2) rotate(0); opacity:1}75%{opacity:1}100%{transform:scale(.9) translateY(-40px); opacity:0}}
.spark{position:absolute; width:18px; height:18px; border-radius:50%; pointer-events:none; z-index:30}

.trace-svg{touch-action:none}
.dot{animation:pulse 1s ease-in-out infinite; transform-box:fill-box; transform-origin:center}
@keyframes pulse{50%{transform:scale(1.3)}}
.hand{position:absolute; font-size:110px; line-height:1; pointer-events:none; z-index:25; opacity:0; transition:opacity .25s}

.seq{width:210px; height:240px; display:grid; place-items:center; font-size:240px; touch-action:none}
.seq.slot{color:#E2E9F3; text-shadow:none}
.seq.piece{text-shadow:0 7px 0 rgba(0,0,0,.1); z-index:3}

.monster{width:320px; height:350px}
.monster svg{width:100%; height:100%; overflow:visible}
.monster .mouth{transform-origin:100px 116px; transition:transform .18s}
.monster.eat .mouth{transform:scale(1.5,2.8)}
.monster .eye{transform-origin:100px 82px; animation:blink 4s infinite; animation-delay:var(--d)}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.food{width:170px; height:200px; touch-action:none; z-index:3; display:flex; flex-direction:column; align-items:center}
.food .emo{font-size:118px; line-height:1}
.food .tag{margin-top:-6px; width:84px; height:84px; border-radius:50%; background:var(--panel); box-shadow:0 5px 0 var(--line);
  display:grid; place-items:center; font-size:62px; color:var(--ink)}
.food.eaten{transition:left .35s ease-in, top .35s ease-in, transform .35s ease-in, opacity .35s !important; transform:scale(.2); opacity:0}

.balloon{position:absolute; left:0; top:0; width:170px; height:260px; touch-action:none}
.balloon svg{width:100%; height:100%; overflow:visible}
.nextTag{position:absolute; right:40px; top:830px; height:140px; padding:0 34px 0 22px; border-radius:70px; background:#7DD3FC;
  box-shadow:0 9px 0 #3BA7D6; display:flex; align-items:center; gap:14px; color:#fff; font-size:96px; z-index:30}
.nextTag .e{display:block; width:110px; height:150px; margin-top:-40px}
.nextTag.go{animation:popin .45s cubic-bezier(.3,1.7,.5,1) both, nudge 1.6s 1s ease-in-out infinite}

#bookBtn{left:30px}
#gearBtn{left:140px; width:80px; height:80px; top:34px; opacity:.7}
#gearBtn svg{width:40px; height:40px}
.apple{width:120px; height:125px; touch-action:none; cursor:pointer}
.cookie{width:140px; height:140px; touch-action:none; z-index:3}
.bubble{position:absolute; left:0; top:0; width:170px; height:170px; border-radius:50%; display:grid; place-items:center; font-size:96px; touch-action:none;
  background:radial-gradient(circle at 32% 28%, rgba(255,255,255,.95) 0 7%, rgba(255,255,255,.25) 8% 38%, rgba(186,224,255,.28) 68%, rgba(255,182,232,.42) 100%);
  box-shadow:inset 0 0 0 4px rgba(255,255,255,.75), inset -12px -16px 26px rgba(160,120,255,.22), 0 8px 20px rgba(80,120,200,.12)}
.bubble > span{text-shadow:0 3px 0 rgba(255,255,255,.8)}
.sticker{position:absolute; width:300px; height:300px; border-radius:50%; padding:22px 40px 10px; background:#fff; z-index:30;
  box-shadow:0 0 0 12px #FFE27A, 0 14px 0 12px #E8B23A; transform-origin:0 0}
.sticker svg{width:100%; height:100%}
.overlay{position:absolute; inset:0; z-index:60; display:grid; place-items:center; background:rgba(20,33,58,.45)}
.sheet{width:1420px; max-height:920px; overflow:auto; background:var(--panel); color:var(--ink); border-radius:40px; padding:28px 40px 36px; box-shadow:0 12px 0 var(--line); font-family:system-ui,"Noto Sans KR",sans-serif}
.sheet-head{display:flex; align-items:center; justify-content:space-between; font-size:44px; font-weight:700; margin-bottom:20px}
.close{width:84px; height:84px; border-radius:50%; background:var(--bg); font-size:44px; line-height:1}
.grid{display:grid; grid-template-columns:repeat(9,140px); gap:14px; justify-content:center}
.cell{position:relative; width:140px; height:170px; border-radius:26px; background:var(--bg); display:grid; place-items:center}
.cell b{font-size:64px; color:var(--line)}
.cell.got svg{width:118px; height:150px}
.cell.got b{position:absolute; right:10px; bottom:8px; font-size:40px; color:var(--ink)}
.pnote{font-size:28px; line-height:1.5; margin:6px 0 18px; opacity:.8}
.vlist{display:flex; flex-wrap:wrap; gap:12px; margin-bottom:24px}
.vbtn{padding:16px 24px; border-radius:20px; background:var(--bg); font-size:28px; text-align:left}
.vbtn small{display:block; font-size:20px; opacity:.6}
.vbtn.on{background:#38BDF8; color:#fff}
.rrow{display:flex; align-items:center; gap:12px; font-size:30px}
.rrow span{margin-right:12px}
.pcard{width:340px; height:400px; border-radius:40px; background:var(--panel); box-shadow:0 12px 0 var(--line); display:grid; place-items:center; transition:box-shadow .2s}
.pcard .pe{font-size:210px; line-height:1}
.pcard .pl{position:absolute; top:18px; left:22px; width:92px; height:92px; border-radius:50%; background:#22C55E; color:#fff; font-size:64px; display:grid; place-items:center; transform:scale(0); transition:transform .35s cubic-bezier(.3,1.7,.5,1)}
.pcard.right{box-shadow:0 0 0 12px #86EFAC, 0 12px 0 12px #4ADE80}
.pcard.right .pl{transform:scale(1)}
.rail2{width:1280px; height:26px; border-radius:13px; background:#C9A27E; z-index:1}
.xbar{width:170px; border-radius:28px; background:var(--c); color:#fff; font-size:110px; display:grid; place-items:center; z-index:2; touch-action:none;
  box-shadow:inset 0 -14px 0 rgba(0,0,0,.08), 0 10px 0 var(--e); text-shadow:0 4px 0 rgba(0,0,0,.12); transition:box-shadow .3s}
.xbar::before,.xbar::after{content:""; position:absolute; left:50%; width:22px; height:22px; margin-left:-11px; border-radius:50%; background:rgba(255,255,255,.7)}
.xbar::before{top:22px} .xbar::after{bottom:26px}
.xbar.lit{box-shadow:0 0 0 10px #FFF3B0, 0 0 40px 16px rgba(255,214,107,.85), 0 10px 0 var(--e)}
.ring{animation:ring .35s}
@keyframes ring{30%{transform:scaleY(.94) translateY(8px)}65%{transform:scaleY(1.02)}}
.ppiece{touch-action:none; z-index:4}
.ppiece svg{display:block; overflow:visible}
.themebg,.deco{pointer-events:none}
.deco{line-height:1}
.mound{transform-origin:50% 100%; z-index:3; touch-action:none}
.bone{z-index:2}
.branch{width:1300px; height:30px; border-radius:15px; background:#9C6B43}
.stem{width:6px; background:#7A5230}
.tray{width:1300px; height:40px; border-radius:20px; background:#D5DCE8; box-shadow:0 8px 0 #B9C3D4}
.nb{z-index:2; touch-action:none}
.nb svg{display:block; overflow:visible}
.nb.lit{filter:drop-shadow(0 0 14px #FFD66B) drop-shadow(0 0 5px #FFF3B0)}
.nb .gotstar{position:absolute; right:-6%; top:-8%; font-size:38%; line-height:1; animation:starpop .5s cubic-bezier(.3,1.6,.5,1) both; pointer-events:none}
@keyframes starpop{0%{transform:scale(0) rotate(-40deg)}100%{transform:scale(1) rotate(0)}}
.bub{width:100%; height:100%; border-radius:50%; display:grid; place-items:center;
  background:radial-gradient(circle at 32% 28%, rgba(255,255,255,.95) 0 7%, rgba(255,255,255,.25) 8% 38%, rgba(186,224,255,.28) 68%, rgba(255,182,232,.42) 100%);
  box-shadow:inset 0 0 0 4px rgba(255,255,255,.75), inset -12px -16px 26px rgba(160,120,255,.22)}
.bobi{animation:bob 2.6s ease-in-out infinite; animation-delay:var(--d)}
.swing{animation:swing .6s; transform-origin:50% -70px}
@keyframes swing{25%{transform:rotate(10deg)}60%{transform:rotate(-7deg)}}
.carrier{position:absolute; left:0; top:0; z-index:2; touch-action:none}
.carrier svg{display:block; overflow:visible}
.road{width:1600px; height:26px; border-radius:13px; background:#E1E6EF}
.water{width:1600px; height:58px; border-radius:30px 30px 0 0; background:linear-gradient(#A8DCFF,#7CC5F2); opacity:.88; z-index:3; pointer-events:none}
.ti{position:absolute; line-height:1; text-align:center; touch-action:none}
.ti .ie{display:block; line-height:1}
.it{position:absolute; left:50%; bottom:-.06em; transform:translateX(-50%); font-size:.36em; width:1.5em; height:1.5em; border-radius:50%; background:#fff; color:#2A3654; box-shadow:0 .08em 0 rgba(0,0,0,.14); display:grid; place-items:center; pointer-events:none}
.nb .ie{display:block; line-height:1; text-align:center}
.tapobj{z-index:2}
.tapobj.off .ie{filter:grayscale(1) brightness(.8); opacity:.6}
.tapobj.glow .ie{filter:drop-shadow(0 0 24px #FFE27A) drop-shadow(0 0 8px #FFF3B0)}
.tapobj.gray .ie{filter:grayscale(1) brightness(1.2); opacity:.5}
.crk{position:absolute; left:28%; top:40%; width:44%; height:30px}
.vine{width:960px; height:22px; border-radius:11px; background:#6FBF5A}
.scoop{width:190px; height:170px; border-radius:50% 50% 44% 44%; display:grid; place-items:center; color:#fff; font-size:90px; touch-action:none;
  box-shadow:inset 0 -14px 0 rgba(0,0,0,.08), inset 10px 10px 0 rgba(255,255,255,.35); text-shadow:0 3px 0 rgba(0,0,0,.14)}
.kite{width:160px; height:280px; touch-action:none; z-index:3}
.kite svg{display:block}
.sway{animation:sway 2.4s ease-in-out infinite; transform-origin:50% 100%}
@keyframes sway{50%{transform:rotate(8deg) translateY(-10px)}}
.splash{width:220px; height:220px; border-radius:50%; background:#FFE45C; opacity:.55; z-index:1; animation:splash .5s ease-out both; pointer-events:none}
@keyframes splash{from{transform:scale(0)}}
.raindrop{position:absolute; width:4px; height:36px; border-radius:2px; background:#8EC5F0; opacity:.7; pointer-events:none; z-index:1}
.pond{width:1180px; height:640px; border-radius:300px; background:linear-gradient(#9ED8F5,#7CC5F2); opacity:.85}
.pad{width:200px; height:140px; border-radius:50%; background:#7BCB5C; color:#fff; font-size:84px; display:grid; place-items:center; z-index:3;
  box-shadow:inset 0 -12px 0 rgba(0,0,0,.1), 0 8px 0 #5AA63F; text-shadow:0 3px 0 rgba(0,0,0,.15)}
.hole{width:220px; height:70px; border-radius:50%; background:#5B4030; box-shadow:inset 0 10px 0 rgba(0,0,0,.25)}
.mclip{width:220px; height:215px; overflow:hidden; z-index:2}
.mouse{position:absolute; left:33px; top:0; transform:translateY(110%); transition:transform .3s cubic-bezier(.3,1.4,.5,1); touch-action:none}
.mouse.up{transform:translateY(25px)}
.jacket{z-index:2}
.jacket svg{display:block}
.zpull{width:80px; height:80px; border-radius:50%; background:#FFD43B; box-shadow:0 0 0 6px #fff, 0 6px 0 6px #E0B000; z-index:4; touch-action:none}
.zpull.ok{background:#4ADE80; box-shadow:0 0 0 6px #fff, 0 6px 0 6px #22A55A}
.wframe{width:340px; height:340px; border-radius:24px; background:#E6F4FF; border:14px solid #7FB2E5}
.foam{width:300px; height:300px; border-radius:16px; z-index:3; touch-action:none; box-shadow:inset 0 0 30px rgba(150,190,230,.5);
  background:radial-gradient(circle at 30% 30%, #fff 0 18%, transparent 19%), radial-gradient(circle at 70% 40%, #fff 0 22%, transparent 23%), radial-gradient(circle at 45% 70%, #fff 0 24%, transparent 25%), radial-gradient(circle at 80% 80%, #fff 0 16%, transparent 17%), #EAF4FB}
.sandpile{width:300px; height:200px; transform-origin:50% 100%; z-index:3; touch-action:none}
.ccard{width:340px; height:400px; border-radius:40px; background:var(--panel); box-shadow:0 12px 0 var(--line); display:grid; place-items:center; font-size:270px; text-shadow:0 6px 0 rgba(0,0,0,.08)}
.ccard.right{box-shadow:0 0 0 12px #86EFAC, 0 12px 0 12px #4ADE80}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important; animation-iteration-count:1 !important}
}
</style>
</head>
<body>

/* 3. guided tracing */
function trace(l, next) {
  const [c] = pal(l);
  const SZ = 640, X0 = 480, Y0 = 190;
  const w = letterSVG(l, SZ, [
    { cls: 'base', color: '#E4EBF5', w: 16 },
    { cls: 'guide', color: '#FFFFFF', w: 2.2, dash: '3 4' },
    { cls: 'fill', color: c, w: 16 }
  ]);
  at(w, X0, Y0); scene.append(w);
  const svg = w.querySelector('svg'); svg.classList.add('trace-svg');
  const strokes = [...svg.querySelectorAll('.fill')].map(p => {
    const len = p.getTotalLength(), n = Math.max(2, Math.ceil(len)) + 1, pts = [];
    for (let i = 0; i < n; i++) { const q = p.getPointAtLength(len * i / (n - 1)); pts.push([q.x, q.y]); }
    p.style.strokeDasharray = `0 ${len + 1}`; p.style.opacity = 0;
    return { p, len, pts };
  });
  const NS = 'http://www.w3.org/2000/svg';
  const dot = document.createElementNS(NS, 'g');
  dot.innerHTML = TRACER[l] ? `<g class="dot"><circle r="9.5" fill="#fff" stroke="${c}" stroke-width="2"/><text font-size="12" text-anchor="middle" dominant-baseline="central" y=".5">${TRACER[l]}</text></g>` : '<g class="dot"><circle r="7.5" fill="#22C55E" stroke="#fff" stroke-width="2.5"/></g>';
  svg.append(dot);
  const hand = mk('div', 'hand', '👆'); scene.append(hand);
  let si = 0, pi = 0, finished = false, lastMove = performance.now(), active = null;
  const cue = i => { const cs = CUES[l]; if (cs && cs[i]) speak([cs[i]]); };
  function place() { const s = strokes[si]; const q = s.pts[pi]; dot.setAttribute('transform', `translate(${q[0]} ${q[1]})`); s.p.style.opacity = pi > 0 ? 1 : 0; s.p.style.strokeDasharray = `${s.len * pi / (s.pts.length - 1)} ${s.len + 1}`; }
  place();
  const toSvg = e => { const m = svg.getScreenCTM().inverse(); const q = new DOMPoint(e.clientX, e.clientY).matrixTransform(m); return [q.x, q.y]; };
  const toStage = (x, y) => { const q = new DOMPoint(x, y).matrixTransform(svg.getScreenCTM()); return pt({ clientX: q.x, clientY: q.y }); };
  function advance(e) {
    if (finished) return;
    const [x, y] = toSvg(e), s = strokes[si];
    let best = -1;
    for (let j = pi; j < Math.min(s.pts.length, pi + 18); j++) {
      const dx = s.pts[j][0] - x, dy = s.pts[j][1] - y;
      if (dx * dx + dy * dy < 13 * 13) best = j;
    }
    if (best > pi) { pi = best; lastMove = performance.now(); hand.style.opacity = 0; place(); }
    if (pi >= s.pts.length - 3) {
      pi = s.pts.length - 1; place();
      if (si < strokes.length - 1) { si++; pi = 0; sfx.pop(); place(); cue(si); }
      else complete();
    }
  }
  function complete() {
    finished = true; dot.remove(); hand.remove();
    svg.querySelectorAll('.guide').forEach(g => g.remove());
    strokes.forEach(s => { s.p.style.strokeDasharray = 'none'; s.p.style.opacity = 1; });
    anim(w, 'hop'); speak([l, 'Beautiful!']); flowers(28); sfx.fanfare();
    later(next, 3000);
  }
  svg.addEventListener('pointerdown', e => { e.preventDefault(); ac(); if (active !== null) return; active = e.pointerId; svg.setPointerCapture(active); advance(e); });
  svg.addEventListener('pointermove', e => { if (e.pointerId === active) advance(e); });
  const end = e => { if (e.pointerId === active) active = null; };
  svg.addEventListener('pointerup', end); svg.addEventListener('pointercancel', end);
  let hintT = -1;
  loop((dt, t) => {
    if (finished) return false;
    if (hintT < 0 && t - lastMove > 2800 && active === null) hintT = 0;
    if (hintT >= 0) {
      hintT += dt;
      const s = strokes[si], k = Math.min(1, hintT / 1.4), j = Math.round(pi + (s.pts.length - 1 - pi) * k);
      const q = toStage(s.pts[j][0], s.pts[j][1]);
      at(hand, q.x - 30, q.y - 8); hand.style.opacity = k < .9 ? 1 : 0;
      if (hintT > 1.8) { hintT = -1; lastMove = t - 600; }
    }
  });
  later(() => speak(["Let's write", l]), 400);
  later(() => { if (si === 0 && pi === 0) cue(0); }, 2300);
}

/* 4. find the letter among look-alikes */
function find(l, next) {
  if (CARRIER[l]) return findThemed(l, next, CARRIER[l]);
  const conf = CONF[l] || [];
  const others = [...conf, ...shuffle(L.filter(x => x !== l && !conf.includes(x)))].slice(0, 5);
  const items = shuffle([l, l, l, l, ...others]).map((x, i) => {
    const e = mk('div', 'float L', capHTML(x)); e.style.color = PAL[i % 6][0];
    const s = { e, x: 80 + Math.random() * 1300, y: 150 + Math.random() * 640, vx: (Math.random() < .5 ? -1 : 1) * (35 + Math.random() * 45), vy: (Math.random() < .5 ? -1 : 1) * (25 + Math.random() * 35), l: x, alive: true, fly: false };
    e.style.transform = `translate(${s.x}px,${s.y}px)`;
    e.style.opacity = 0; e.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 500, delay: i * 60, fill: 'forwards' });
    scene.append(e);
    e.addEventListener('pointerdown', ev => {
      ev.preventDefault();
      if (!s.alive || s.fly) return;
      if (x === l) {
        s.alive = false; e.classList.add('gone'); say(l); sfx.pop(); sparks(s.x + 75, s.y + 85, 14);
        later(() => e.remove(), 350);
        if (!items.some(it => it.l === l && it.alive)) {
          later(() => { items.forEach(it => { if (it.alive) { it.fly = true; it.vy = -1400; } }); sfx.whoosh(); }, 500);
          later(() => {
            const w = letterSVG(l, 520, [{ cls: 'ink', color: pal(l)[0], w: 14 }]); at(w, 540, 220); w.classList.add('popin'); scene.append(w);
            flowers(); sfx.fanfare(); praise();
          }, 1100);
          later(next, 3400);
        }
      } else { anim(e.firstChild, 'wiggle'); sfx.boop(); }
    });
    return s;
  });
  loop(dt => {
    for (const s of items) {
      if (!s.alive) continue;
      s.x += s.vx * dt; s.y += s.vy * dt;
      if (!s.fly) {
        if (s.x < 40 || s.x > 1410) { s.vx *= -1; s.x = Math.max(40, Math.min(1410, s.x)); }
        if (s.y < 140 || s.y > 800) { s.vy *= -1; s.y = Math.max(140, Math.min(800, s.y)); }
      }
      s.e.style.transform = `translate(${s.x}px,${s.y}px)`;
    }
  });
  later(() => speak(['Find the letter', l]), 600);
}

/* shape puzzle: build the letter from its pieces */
function puzzle(l, next) {
  const [c] = pal(l);
  const SZ = 480, X0 = 190, Y0 = 250, k = SZ / 116, NS = 'http://www.w3.org/2000/svg';
  const outline = letterSVG(l, SZ, [{ cls: 'shadow', color: '#DCE5F1', w: 20 }, { cls: 'guide', color: '#FFFFFF', w: 2.2, dash: '3 4' }]);
  at(outline, X0, Y0); outline.style.zIndex = 1; scene.append(outline);
  const tmp = document.createElementNS(NS, 'svg');
  tmp.setAttribute('viewBox', '-8 -8 116 116'); tmp.style.cssText = 'position:absolute;width:10px;height:10px;visibility:hidden';
  document.body.append(tmp);
  let ds = STROKES[l].slice();
  if (ds.length === 1) {

/* zip up the jackets (Z) */
function zipGame(l, next, cfg) {
  const ani = sideCritter(l, 1390, 560, 190);
  const cols = shuffle(PAL), K = 3, bg = (THEME[l] || { sky: ['#fff', '#fff'] }).sky[1];
  let done = 0;
  [200, 590, 980].forEach((X, k) => {
    const Y = 300, wrap = mk('div', 'abs jacket popin'); wrap.style.animationDelay = (.3 + k * .12) + 's'; at(wrap, X, Y); scene.append(wrap);
    const [c, e] = cols[k];
    const draw = py => {
      const g = 16 * (py - 12) / 108;
      wrap.innerHTML = `<svg viewBox="0 0 100 130" width="300" height="390"><path d="M20 10 L40 4 Q50 12 60 4 L80 10 L98 40 L84 48 L84 126 L16 126 L16 48 L2 40Z" fill="${c}" stroke="${e}" stroke-width="2.5" stroke-linejoin="round"/><polygon points="${50 - g},9 ${50 + g},9 50,${py}" fill="${bg}"/><line x1="50" y1="${py}" x2="50" y2="125" stroke="#fff" stroke-width="3" stroke-dasharray="3 2"/><text x="30" y="90" text-anchor="middle" font-family="Baloo 2, Arial Rounded MT Bold, sans-serif" font-weight="800" font-size="22" fill="#fff">${l}</text></svg>`;
    };
    let py = 120; draw(py);
    const pull = mk('div', 'abs zpull'); scene.append(pull);
    const place = () => at(pull, X + 50 * K - 40, Y + py * K - 40);
    place();
    let id = null, oy = 0, fin = false;
    pull.addEventListener('pointerdown', ev => { ev.preventDefault(); ac(); if (fin) return; id = ev.pointerId; pull.setPointerCapture(id); oy = pt(ev).y - (Y + py * K); });
    pull.addEventListener('pointermove', ev => {
      if (ev.pointerId !== id || fin) return;
      const ny = Math.max(12, Math.min(120, (pt(ev).y - oy - Y) / K));
      if (Math.abs(ny - py) > 4) tone(1400 + Math.random() * 300, 0, .03, 'square', .025);
      py = ny; draw(py); place();
      if (py <= 14) {
        fin = true; done++; py = 12; draw(py); place(); pull.classList.add('ok');
        speak([l, 'zip!']); sfx.ding(); sparks(X + 150, Y + 40, 14); anim(wrap, 'hop');
        if (done === 3) finish(cfg, ani, next);
      }
    });
    const up = ev => { if (ev.pointerId === id) id = null; };
    pull.addEventListener('pointerup', up); pull.addEventListener('pointercancel', up);
  });
  const hand = mk('div', 'hand', '👆'); scene.append(hand);
  let t0 = performance.now();
  loop((dt, t) => {
    if (done > 0) { hand.style.opacity = 0; return false; }
    const k = ((t - t0) % 2400) / 1500;
    if (k <= 1) { at(hand, 330, 640 - k * 300); hand.style.opacity = 1; } else hand.style.opacity = 0;
  });
  later(() => speak(cfg.start), 700);
}

/* rub to reveal (W foam on windows, X sand on treasure) */
function rubGame(l, next, cfg) {
  const ani = sideCritter(l, 1390, 560, 190);
  const hand = mk('div', 'hand', '👆'); scene.append(hand);
  let found = 0, lastAct = performance.now();
  const spots = [190, 590, 990].map(x => ({ x, done: false }));
  spots.forEach((sp, k) => {
    const x = sp.x, sand = cfg.cover === 'sand';
    const y = sand ? 650 : 330;
    if (!sand) { const fr = mk('div', 'abs wframe'); at(fr, x - 20, y - 20); scene.append(fr); }
    const rv = tObj(cfg.reveals[k % cfg.reveals.length], l, 150, 'abs'); rv.style.zIndex = 2; at(rv, x + 55, sand ? y + 20 : y + 50); scene.append(rv);
    const cv = mk('div', 'abs ' + (sand ? 'sandpile' : 'foam') + ' popin');
    if (sand) cv.innerHTML = '<svg viewBox="0 0 300 200" width="100%" height="100%"><path d="M0 200 C10 90 80 40 150 38 C220 40 290 90 300 200Z" fill="#E9C989"/><path d="M118 70 L182 130 M182 70 L118 130" stroke="#E2463F" stroke-width="14" stroke-linecap="round"/></svg>';
    cv.style.animationDelay = (k * .12) + 's'; at(cv, x, sand ? y - 20 : y); scene.append(cv);
    let dist = 0, acc = 0, id = null, lx = 0, ly = 0;
    cv.addEventListener('pointerdown', e => { e.preventDefault(); ac(); if (sp.done) return; id = e.pointerId; cv.setPointerCapture(id); const p = pt(e); lx = p.x; ly = p.y; lastAct = performance.now(); });
    cv.addEventListener('pointermove', e => {
      if (e.pointerId !== id || sp.done) return;
      const p = pt(e), d = Math.hypot(p.x - lx, p.y - ly); lx = p.x; ly = p.y; dist += d; acc += d;
      lastAct = performance.now(); hand.style.opacity = 0;
      if (acc > 50) { acc = 0; if (sand) dirt(p.x, p.y); else sparks(p.x, p.y, 3, ['#FFFFFF', '#D6EEFF']); noise(0, .06, .15, sand ? 500 : 2500, .7); }
      const pr = Math.min(1, dist / 800);
      if (sand) cv.style.transform = `scaleY(${1 - pr * .9})`; else cv.style.opacity = 1 - pr * .85;
      if (pr >= 1) {
        sp.done = true; cv.style.transition = 'opacity .4s'; cv.style.opacity = 0; rv.style.zIndex = 5;
        anim(rv, 'hop'); sfx.ding(); sparks(x + 140, y + 120, 14); speak(cfg.each(l, k)); found++;
        if (found === spots.length) finish(cfg, ani, next, 4200);
      }
    });
    const up = e => { if (e.pointerId === id) id = null; };
    cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
  });
  loop((dt, t) => {
    const r = spots.find(s => !s.done);
    if (!r) { hand.style.opacity = 0; return false; }
    if (performance.now() - lastAct > 3000) { hand.style.opacity = 1; at(hand, r.x + 110 + Math.sin(t / 180) * 70, cfg.cover === 'sand' ? 720 : 450); }
  });
  later(() => speak(cfg.start), 700);
}

  ov.append(sh); stage.append(ov);

  sh.querySelector('.close').addEventListener('click', close);
  ov.addEventListener('click', e => { if (e.target === ov) close(); });
  return sh.querySelector('.sheet-body');
}
function openBook() {
  const body = overlay(`스티커북 ${done.size} / 26`);
  const g = mk('div', 'grid'); body.append(g);
  L.forEach(l => {
    const got = done.has(l);
    const cell = mk('button', 'cell' + (got ? ' got' : ''), (got ? critter(l) : '') + `<b class="L">${capHTML(l)}</b>`);
    cell.type = 'button'; cell.setAttribute('aria-label', l);
    cell.addEventListener('click', () => { if (got) { speak(INTRO(l)); anim(cell, 'hop'); } else { say(l); } });
    g.append(cell);
  });
}
function openSettings() {
  loadVoices();
  const body = overlay('음성 설정');
  const note = mk('p', 'pnote', canSpeak ? '아이에게 들려줄 영어 음성을 골라 주세요. 누르면 바로 들어볼 수 있어요.' : '이 화면에서는 음성 기능을 쓸 수 없어요. Chrome에서 링크를 열어 주세요.');
  body.append(note);
  const fsRow = mk('div', 'rrow', '<span>전체 화면</span>'); body.append(fsRow);
  [['항상 켜기', true], ['끄기', false]].forEach(([t, v]) => {
    const b = mk('button', 'vbtn' + (autoFS === v ? ' on' : ''), t); b.type = 'button';
    b.addEventListener('click', () => { autoFS = v; store('abc2-fs', v); fsRow.querySelectorAll('.vbtn').forEach(x => x.classList.toggle('on', x === b)); if (v) goFS(); else exitFS(); });
    fsRow.append(b);
  });
  if (standalone) fsRow.append(mk('span', 'pnote', '홈 화면 앱으로 실행 중이라 이미 전체 화면이에요.'));
  else if (!fsReq || fsFailed) fsRow.append(mk('span', 'pnote', '이 화면에서는 전체 화면이 지원되지 않아요. 홈 화면 아이콘으로 열어 주세요.'));
  body.append(mk('div', '', '<br>'));
  if (!canSpeak) return;
  const list = mk('div', 'vlist'); body.append(list);
  if (!voices.length) list.append(mk('p', 'pnote', '이 기기에 영어 음성이 없어요. 기기 설정에서 Google 음성 서비스의 영어(미국) 음성을 내려받아 주세요.'));
  voices.forEach(v => {
    const b = mk('button', 'vbtn' + (voice && v.voiceURI === voice.voiceURI ? ' on' : ''), `${v.name}<small>${v.lang}</small>`);
    b.type = 'button';
    b.addEventListener('click', () => {
      voice = v; store('abc2-voice', v.voiceURI);
      list.querySelectorAll('.vbtn').forEach(x => x.classList.toggle('on', x === b));
      speak(['Hi there!', 'A', 'is for apple.']);
    });
    list.append(b);
  });
  const row = mk('div', 'rrow', '<span>말하기 속도</span>'); body.append(row);
  [['천천히', .72], ['보통', .85], ['조금 빠르게', .95]].forEach(([t, r]) => {
    const b = mk('button', 'vbtn' + (Math.abs(rate - r) < .01 ? ' on' : ''), t); b.type = 'button';
    b.addEventListener('click', () => { rate = r; store('abc2-rate', r); row.querySelectorAll('.vbtn').forEach(x => x.classList.toggle('on', x === b)); speak(['Great job!']); });
    row.append(b);
  });
  body.append(mk('p', 'pnote', '목소리가 딱딱하게 들리면 기기 설정에서 Google 음성 서비스의 고품질 영어(미국) 음성을 내려받은 뒤 여기서 다시 골라 주세요.'));
}
$('#bookBtn').addEventListener('click', openBook);
$('#gearBtn').addEventListener('click', openSettings);

/* ================= boot ================= */
window.__abc = { startLesson, runStep: i => runStep(i), showTrain };
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
showTrain();
})();
</script>
